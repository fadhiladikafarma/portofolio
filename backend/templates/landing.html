<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fadhil Adika | API Backend</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fafafa;
            color: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .card {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 16px;
            padding: 48px;
            max-width: 520px;
            width: 100%;
            text-align: center;
        }
        h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 12px; }
        h1 span { color: #888; }
        p { color: #666; font-size: 0.9rem; margin-bottom: 24px; line-height: 1.6; }
        .status {
            display: inline-block;
            padding: 6px 16px;
            background: #dcfce7;
            color: #166534;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 24px;
        }
        .links { display: flex; flex-direction: column; gap: 12px; }
        a {
            display: block;
            padding: 14px 20px;
            border: 1px solid #eee;
            border-radius: 10px;
            color: #111;
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        a:hover { border-color: #111; transform: translateY(-1px); }
        small { color: #aaa; font-size: 0.75rem; margin-top: 24px; display: block; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Portofolio <span>Backend</span></h1>
        <div class="status">Server aktif</div>
        <p>Ini adalah layanan API &amp; admin panel untuk website portofolio Fadhil Adika. Frontend di-host terpisah dan mengambil data dari layanan ini.</p>
        <div class="links">
            <a href="/admin">Admin Panel (Kelola Proyek &amp; Pesan)</a>
        </div>
        <small>&copy; 2026 Fadhil Adika</small>
    </div>
</body>
</html>
